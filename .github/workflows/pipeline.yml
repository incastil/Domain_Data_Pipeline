name: Pipeline CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: pip install flake8

      - name: Run lint
        run: flake8 *.py --max-line-length=100 --ignore=E501

  smoke-test:
    name: Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py

      - name: Verify outputs exist
        run: |
          test -f raw_orders.json  && echo "raw_orders.json OK"
          test -f clean_orders.csv && echo "clean_orders.csv OK"
          test -f orders.db        && echo "orders.db OK"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t domain-data-pipeline .

      - name: Run pipeline in Docker
        run: |
          mkdir -p output
          docker run --rm -v $(pwd)/output:/app domain-data-pipeline

      - name: Verify Docker output
        run: |
          test -f output/orders.db && echo "orders.db produced by Docker OK"
